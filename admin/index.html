<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>AM Vegetables · Content Manager</title>
    <!-- Absolute path so it also works when opened as /admin (no trailing slash) -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Brand: same green as the app. Decap's class names are generated, so
         these rules stick to elements and stable attributes. */
      :root { --am-green: #0b6b3a; --am-green-dark: #064d29; --am-bg: #f3f8f2; }

      body, input, textarea, select, button {
        font-family: "Plus Jakarta Sans", "Noto Sans Tamil", system-ui, sans-serif !important;
      }
      body { background: var(--am-bg); }

      /* Easier to read and tap, especially for Tamil text */
      input[type="text"], input[type="number"], input[type="url"], textarea, select {
        font-size: 15px !important;
        line-height: 1.5;
      }
      textarea { min-height: 96px; }
      label { font-weight: 600; }

      /* Primary buttons and focus ring in brand green */
      button[class*="primary"], button[type="submit"] { background-color: var(--am-green) !important; }
      button[class*="primary"]:hover, button[type="submit"]:hover { background-color: var(--am-green-dark) !important; }
      input:focus, textarea:focus, select:focus {
        outline: 2px solid var(--am-green) !important;
        outline-offset: 0;
      }
      ::selection { background: #c8e6c9; }

      /* Slim scrollbars for the long product form */
      * { scrollbar-width: thin; scrollbar-color: #a5b9a6 transparent; }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="/admin/cms-extras.js"></script>
  </body>
</html>
