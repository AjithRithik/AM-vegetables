<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Stock Today · AM Vegetables</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #2e7d32; --green-dark: #1b5e20; --bg: #f4f7f2; --card: #fff;
      --text: #1d2b1f; --muted: #6b7c6d; --line: #dfe7dc; --red: #c62828; --amber: #fff4d6;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121a13; --card: #1b261c; --text: #e6efe6; --muted: #98a99a; --line: #2c3b2d; --amber: #3a3114; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 "Plus Jakarta Sans", "Noto Sans Tamil", system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px; }
    .wrap { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 18px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    h1 a { font-size: 13px; font-weight: 600; color: var(--green); text-decoration: none; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input[type=search], select { font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
    input[type=search] { flex: 1 1 180px; min-width: 0; }
    button { font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
    button.primary { background: var(--green); border-color: var(--green); color: #fff; }
    button.primary:hover:not(:disabled) { background: var(--green-dark); }
    button:disabled { opacity: .5; cursor: default; }
    .stats { color: var(--muted); font-size: 13px; margin-top: 8px; }
    main { padding: 12px 16px 96px; }
    .row { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
    .row.changed { background: var(--amber); }
    .row img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--line); flex: none; }
    .info { flex: 1; min-width: 0; }
    .info b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .info span { color: var(--muted); font-size: 13px; }
    .switch { position: relative; width: 52px; height: 30px; flex: none; }
    .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
    .switch i { position: absolute; inset: 0; background: #b9c4ba; border-radius: 30px; transition: .15s; }
    .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; background: #fff; border-radius: 50%; transition: .15s; }
    .switch input:checked + i { background: var(--green); }
    .switch input:checked + i::after { transform: translateX(22px); }
    .switch input:focus-visible + i { outline: 2px solid var(--green); outline-offset: 2px; }
    .msg { margin: 16px; padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
    .msg.err { border-color: var(--red); color: var(--red); }
    .savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px; display: none; }
    .savebar.show { display: block; }
    .savebar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .ta { font-family: "Noto Sans Tamil", sans-serif; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1><span>Stock Today / இன்று இருப்பு</span> <a href="/admin/">← Back to CMS</a></h1>
      <div class="tools" id="tools" hidden>
        <input type="search" id="q" placeholder="Search product…" aria-label="Search product" />
        <select id="cat" aria-label="Category"></select>
        <button id="allIn" title="Mark all shown products in stock">All in</button>
        <button id="allOut" title="Mark all shown products out of stock">All out</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <main class="wrap" id="list"></main>

  <div class="savebar" id="savebar">
    <div class="wrap">
      <span id="pending"></span>
      <span>
        <button id="discard">Discard</button>
        <button class="primary" id="save">Save &amp; publish</button>
      </span>
    </div>
  </div>

  <script>
    // Same repo/branch as admin/config.yml. Uses the GitHub token Decap stores
    // in this browser after "Login with GitHub" on /admin/.
    const REPO = 'AjithRithik/AM-vegetables';
    const BRANCH = 'main';
    const DIR = 'content/products';
    const API = 'https://api.github.com/repos/' + REPO;

    const $ = (id) => document.getElementById(id);
    let products = [];        // [{id, name_en, name_ta, category_en, image, in_stock}]
    const original = {};      // id -> in_stock as loaded
    const changes = {};       // id -> new in_stock

    function getToken() {
      for (const key of ['decap-cms-user', 'netlify-cms-user']) {
        try {
          const u = JSON.parse(localStorage.getItem(key) || 'null');
          if (u && u.token) return u.token;
        } catch (_) {}
      }
      return null;
    }

    function show(text, err, html) {
      const d = document.createElement('div');
      d.className = 'msg' + (err ? ' err' : '');
      if (html) d.innerHTML = html; else d.textContent = text;
      $('list').replaceChildren(d);
    }

    async function gh(path, opts = {}) {
      const r = await fetch(API + path, {
        ...opts,
        headers: {
          Authorization: 'Bearer ' + getToken(),
          Accept: 'application/vnd.github+json',
          'Content-Type': 'application/json',
          ...(opts.headers || {}),
        },
      });
      if (!r.ok) {
        const body = await r.text();
        throw new Error('GitHub ' + r.status + ': ' + body.slice(0, 200));
      }
      return r.json();
    }

    const stockOf = (p) => (p.id in changes ? changes[p.id] : original[p.id]);

    function render() {
      const q = $('q').value.trim().toLowerCase();
      const cat = $('cat').value;
      const shown = products.filter((p) =>
        (!cat || p.category_en === cat) &&
        (!q || (p.name_en + ' ' + p.name_ta + ' ' + (p.name_alt || '')).toLowerCase().includes(q)));

      const frag = document.createDocumentFragment();
      for (const p of shown) {
        const row = document.createElement('label');
        row.className = 'row' + (p.id in changes ? ' changed' : '');
        const img = document.createElement('img');
        img.alt = ''; img.loading = 'lazy';
        if (p.image) img.src = p.image;
        const info = document.createElement('div');
        info.className = 'info';
        const b = document.createElement('b'); b.textContent = p.name_en;
        const s = document.createElement('span');
        s.className = 'ta'; s.textContent = p.name_ta + ' · ' + p.category_en;
        info.append(b, s);
        const sw = document.createElement('span');
        sw.className = 'switch';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = stockOf(p);
        cb.setAttribute('aria-label', p.name_en + ' in stock');
        cb.addEventListener('change', () => set(p.id, cb.checked, true));
        sw.append(cb, document.createElement('i'));
        row.append(img, info, sw);
        frag.append(row);
      }
      if (!shown.length) {
        const d = document.createElement('div'); d.className = 'msg'; d.textContent = 'No products match.';
        frag.append(d);
      }
      $('list').replaceChildren(frag);
      stats(shown);
    }

    function set(id, value, rerender) {
      if (value === original[id]) delete changes[id]; else changes[id] = value;
      if (rerender) { updateBar(); render(); }
    }

    function stats(shown) {
      const inStock = products.filter((p) => stockOf(p)).length;
      $('stats').textContent = inStock + ' in stock · ' + (products.length - inStock) + ' out · showing ' + shown.length + ' of ' + products.length;
    }

    function updateBar() {
      const n = Object.keys(changes).length;
      $('savebar').classList.toggle('show', n > 0);
      $('pending').textContent = n + ' unsaved change' + (n === 1 ? '' : 's');
    }

    function bulk(value) {
      const q = $('q').value.trim().toLowerCase();
      const cat = $('cat').value;
      for (const p of products) {
        if ((!cat || p.category_en === cat) &&
            (!q || (p.name_en + ' ' + p.name_ta + ' ' + (p.name_alt || '')).toLowerCase().includes(q))) {
          set(p.id, value, false);
        }
      }
      updateBar(); render();
    }

    const b64ToText = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), (c) => c.charCodeAt(0)));

    async function save() {
      const ids = Object.keys(changes);
      if (!ids.length) return;
      const btn = $('save');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const ref = await gh('/git/ref/heads/' + BRANCH);
        const head = await gh('/git/commits/' + ref.object.sha);
        // Read each changed product fresh from the repo so other fields stay untouched.
        const tree = [];
        for (const id of ids) {
          const f = await gh('/contents/' + DIR + '/' + encodeURIComponent(id) + '.json?ref=' + BRANCH);
          const obj = JSON.parse(b64ToText(f.content));
          obj.in_stock = changes[id];
          tree.push({ path: DIR + '/' + id + '.json', mode: '100644', type: 'blob', content: JSON.stringify(obj, null, 2) + '\n' });
        }
        const newTree = await gh('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: head.tree.sha, tree }) });
        const out = ids.filter((id) => !changes[id]).length;
        const commit = await gh('/git/commits', {
          method: 'POST',
          body: JSON.stringify({
            message: 'Stock update: ' + (ids.length - out) + ' in stock, ' + out + ' out of stock (' + ids.length + ' changed)',
            tree: newTree.sha,
            parents: [ref.object.sha],
          }),
        });
        await gh('/git/refs/heads/' + BRANCH, { method: 'PATCH', body: JSON.stringify({ sha: commit.sha }) });
        for (const id of ids) { original[id] = changes[id]; delete changes[id]; }
        updateBar(); render();
        alert('Saved. The app updates after the site redeploys (about a minute).');
      } catch (e) {
        alert('Could not save.\n' + e.message + '\n\nIf this says 401, log in again at /admin/.');
      } finally {
        btn.disabled = false; btn.textContent = 'Save & publish';
      }
    }

    async function init() {
      if (!getToken()) {
        show('', false, 'You are not logged in. <a href="/admin/">Open the CMS and click “Login with GitHub”</a>, then come back to this page.');
        return;
      }
      show('Loading products…');
      try {
        const r = await fetch('/content/products.json', { cache: 'no-store' });
        if (!r.ok) throw new Error('products.json HTTP ' + r.status);
        products = (await r.json()).products
          .map((p) => ({ id: p.id, name_en: p.name_en, name_ta: p.name_ta, name_alt: p.name_alt, category_en: p.category_en, image: p.image, in_stock: p.in_stock !== false, sort: p.sort ?? 100 }))
          .sort((a, b) => a.category_en.localeCompare(b.category_en) || a.name_en.localeCompare(b.name_en));
      } catch (e) { show('Could not load products: ' + e.message, true); return; }

      for (const p of products) original[p.id] = p.in_stock;
      const cats = [...new Set(products.map((p) => p.category_en))];
      $('cat').replaceChildren(new Option('All categories', ''), ...cats.map((c) => new Option(c, c)));
      $('tools').hidden = false;
      $('q').addEventListener('input', render);
      $('cat').addEventListener('change', render);
      $('allIn').addEventListener('click', () => bulk(true));
      $('allOut').addEventListener('click', () => bulk(false));
      $('discard').addEventListener('click', () => { for (const k in changes) delete changes[k]; updateBar(); render(); });
      $('save').addEventListener('click', save);
      window.addEventListener('beforeunload', (e) => { if (Object.keys(changes).length) { e.preventDefault(); e.returnValue = ''; } });
      render();
    }
    init();
  </script>
</body>
</html>
