<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0f7a43" />
  <title>AM Vegetables · Admin</title>
  <link rel="icon" href="/images/uploads/branding/am-vegetables-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand:#0f7a43; --brand-ink:#fff; --brand-soft:#e3f4ea; --brand-dark:#0a5a31;
      --bg:#f5f7f5; --surface:#fff; --surface-2:#f0f4f1; --ink:#14211a; --muted:#65756b; --line:#e3e9e4;
      --warn:#b45309; --warn-soft:#fff4dc; --red:#c62828; --red-soft:#fdeaea; --amber:#f5a623;
      --shadow:0 1px 2px rgba(16,32,22,.05), 0 4px 16px rgba(16,32,22,.05);
      --radius:14px; --bar-h:0px; color-scheme:light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --brand:#27a862; --brand-soft:#173325; --brand-dark:#6fe0a2; --bg:#0e1411; --surface:#161f1a; --surface-2:#1d2923;
              --ink:#e8f0ea; --muted:#91a398; --line:#26342c; --warn:#f0b24a; --warn-soft:#33270f; --red:#ff7a7a; --red-soft:#3a1a1a;
              --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark; }
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    [hidden] { display:none !important; }
    html { scroll-padding-top:120px; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 "Plus Jakarta Sans","Noto Sans Tamil",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    button, input, select, textarea { font:inherit; color:inherit; }
    button { cursor:pointer; }
    .ta { font-family:"Noto Sans Tamil",sans-serif; }
    .ico { display:inline-flex; flex:none; }
    small, .muted { color:var(--muted); }
    h1, h2, h3, h4 { margin:0; }

    /* ---------- app shell ---------- */
    .shell { display:grid; grid-template-columns:264px minmax(0,1fr); min-height:100vh; }
    .side { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:18px; padding:20px 16px; background:var(--surface); border-right:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; padding:2px 6px; }
    .brand img { width:38px; height:38px; border-radius:10px; object-fit:cover; background:var(--brand-soft); }
    .brand b { display:block; font-size:16px; line-height:1.1; }
    .brand small { font-size:12px; }
    .locpick { display:block; }
    .locpick .cap { display:block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 4px 6px; }
    .locpick select { width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2); font-weight:700; }
    .nav { display:flex; flex-direction:column; gap:4px; }
    .navbtn { display:flex; align-items:center; gap:12px; padding:11px 12px; border:0; background:none; border-radius:12px; font-weight:700; color:var(--muted); text-align:left; }
    .navbtn:hover { background:var(--surface-2); color:var(--ink); }
    .navbtn.on { background:var(--brand-soft); color:var(--brand-dark); }
    .userblock { margin-top:auto; display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--line); border-radius:14px; }
    .avatar { width:36px; height:36px; border-radius:50%; background:var(--brand); color:var(--brand-ink); display:flex; align-items:center; justify-content:center; font-weight:800; flex:none; }
    .uinfo { min-width:0; flex:1; }
    .uinfo b { display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .uinfo small { font-size:12px; }
    .iconbtn { width:38px; height:38px; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); padding:0; }
    .iconbtn:hover:not(:disabled) { background:var(--surface-2); }
    .iconbtn:disabled { opacity:.35; cursor:default; }
    .content { min-width:0; padding:28px clamp(16px,3vw,40px) 60px; }
    #main { max-width:1080px; margin:0 auto; }

    @media (max-width:899px) {
      .shell { display:block; --bar-h:60px; }
      .side { height:auto; flex-direction:row; align-items:center; gap:10px; padding:9px 14px; z-index:20; border-right:0; border-bottom:1px solid var(--line); }
      .brand { flex:1; min-width:0; padding:0; } .brand small { display:none; }
      .brand b { font-size:15px; }
      .locpick { flex:none; max-width:44vw; } .locpick .cap { display:none; }
      .locpick select { padding:8px 10px; font-size:14px; }
      .userblock { margin:0; padding:0; border:0; } .avatar, .uinfo { display:none; }
      .nav { position:fixed; left:0; right:0; bottom:0; z-index:25; flex-direction:row; gap:0; padding:6px 8px calc(6px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line); }
      .navbtn { flex:1; flex-direction:column; gap:3px; padding:7px 4px; font-size:11px; text-align:center; align-items:center; }
      .content { padding:16px 14px 100px; }
    }

    /* ---------- page pieces ---------- */
    .pagehead { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
    .pagehead h1 { font-size:24px; font-weight:800; letter-spacing:-.01em; }
    .pagehead .sub { color:var(--muted); font-size:14px; margin-top:2px; }
    .headacts { display:flex; gap:8px; flex-wrap:wrap; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr)); gap:14px; margin-bottom:14px; }
    .card h3 { font-size:17px; font-weight:800; }

    /* buttons + inputs */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:40px; padding:9px 16px; border-radius:11px; border:1.5px solid var(--line); background:var(--surface); font-weight:700; font-size:14px; text-decoration:none; color:var(--ink); }
    .btn:hover:not(:disabled) { background:var(--surface-2); }
    .btn.primary { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
    .btn.primary:hover:not(:disabled) { filter:brightness(1.08); background:var(--brand); }
    .btn.danger { color:var(--red); border-color:transparent; background:var(--red-soft); }
    .btn.small { min-height:34px; padding:6px 12px; font-size:13px; border-radius:10px; }
    .btn.block { width:100%; }
    .btn:disabled { opacity:.55; cursor:default; }
    .field { width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:11px; background:var(--surface); font-size:15px; }
    textarea.field { min-height:84px; resize:vertical; }
    .field:focus, .search-in:focus, .pin-price:focus, .locpick select:focus { outline:3px solid color-mix(in srgb, var(--brand) 28%, transparent); border-color:var(--brand); }
    .field:disabled { background:var(--surface-2); color:var(--muted); }

    /* toolbar */
    .toolbar { position:sticky; top:var(--bar-h); z-index:8; background:var(--bg); padding:8px 0 10px; display:grid; gap:10px; }
    @media (min-width:900px) { .toolbar { grid-template-columns:minmax(220px,320px) 1fr; align-items:center; } .toolbar .chips { grid-column:1 / -1; } }
    .searchbox { position:relative; display:block; }
    .searchbox .ico { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
    .search-in { width:100%; padding:11px 13px 11px 38px; border:1.5px solid var(--line); border-radius:11px; background:var(--surface); font-size:15px; }
    .seg { display:flex; gap:3px; background:var(--surface-2); padding:3px; border-radius:12px; overflow-x:auto; scrollbar-width:none; }
    .seg::-webkit-scrollbar { display:none; }
    .seg button { flex:1 0 auto; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 12px; border:0; background:none; border-radius:9px; font-weight:700; font-size:13px; color:var(--muted); white-space:nowrap; }
    .seg button.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
    .cnt { font-size:11px; background:var(--line); color:var(--muted); border-radius:20px; padding:1px 7px; font-weight:800; }
    .seg button.on .cnt { background:var(--brand-soft); color:var(--brand-dark); }
    .chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
    .chips::-webkit-scrollbar { display:none; }
    .chip { flex:none; padding:6px 13px; border-radius:20px; border:1.5px solid var(--line); background:var(--surface); font-weight:600; font-size:13px; }
    .chip.on { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }

    /* progress */
    .progress { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:6px; }
    .progress .txt { flex:1 1 220px; min-width:0; }
    .progress .txt b { font-size:15px; }
    .bar { height:8px; background:var(--surface-2); border-radius:8px; overflow:hidden; margin-top:8px; }
    .bar i { display:block; height:100%; background:var(--brand); border-radius:8px; transition:width .3s; }

    /* product list */
    .listcard { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
    .prod { display:grid; grid-template-columns:1fr; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
    .prod:last-child { border-bottom:0; }
    .prod:hover { background:color-mix(in srgb, var(--surface-2) 55%, transparent); }
    /* Layout follows the width of the list, not the screen: stacked -> two lines -> one line */
    .listcard { container-type:inline-size; }
    @container (min-width:600px) {
      .prod { grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"main ctl" "packs packs"; align-items:center; gap:10px 16px; padding:12px 18px; }
      .pmain { grid-area:main; } .ppacks { grid-area:packs; } .pctl { grid-area:ctl; }
    }
    @container (min-width:1120px) {
      .prod { grid-template-columns:minmax(200px,.9fr) minmax(0,2.1fr) auto; grid-template-areas:"main packs ctl"; padding:10px 18px; }
    }
    .pmain { display:flex; align-items:center; gap:12px; min-width:0; }
    .pthumb { width:52px; height:52px; border-radius:12px; object-fit:cover; background:var(--brand-soft); flex:none; display:flex; align-items:center; justify-content:center; color:var(--brand); }
    .prod.off .pthumb { filter:grayscale(1); opacity:.5; }
    .prod.off .pname { color:var(--muted); }
    .pinfo { min-width:0; }
    .pname { font-weight:800; line-height:1.2; }
    .pta { color:var(--muted); font-size:13px; line-height:1.3; }
    .pmeta { display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; }
    .pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; background:var(--surface-2); color:var(--muted); }
    .pill.warn { background:var(--warn-soft); color:var(--warn); }
    .pill.ok { background:var(--brand-soft); color:var(--brand-dark); }
    .pill.off { background:var(--red-soft); color:var(--red); }
    .ppacks { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 100px)); gap:8px; align-items:end; justify-content:start; }
    .ppacks.note { display:flex; color:var(--muted); font-size:13px; align-items:center; }
    .pbox { min-width:0; }
    .pbox .cap { display:block; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .money { position:relative; }
    .money .cur { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:700; pointer-events:none; font-size:14px; }
    .pin-price { width:100%; padding:8px 8px 8px 24px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; font-weight:700; background:var(--surface); }
    .pin-price.missing { border-color:color-mix(in srgb, var(--warn) 55%, var(--line)); background:var(--warn-soft); }
    .pin-price.saved { border-color:var(--brand); background:var(--brand-soft); }
    .pin-price:disabled { background:var(--surface-2); }
    .pctl { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .pctl { justify-content:space-between; padding-top:8px; border-top:1px dashed var(--line); }
    @container (min-width:600px) { .pctl { justify-content:flex-end; padding-top:0; border-top:0; flex-wrap:nowrap; } }
    .pin-price::-webkit-outer-spin-button, .pin-price::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
    .pin-price { -moz-appearance:textfield; appearance:textfield; }
    .tog { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; }
    .tog.dis { opacity:.45; }
    .star { color:#b8c2ba; }
    .star.on { color:var(--amber); } .star.on svg { fill:currentColor; }

    .switch { position:relative; width:40px; height:24px; flex:none; display:inline-block; }
    .switch input { position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; z-index:1; cursor:pointer; }
    .switch input:disabled { cursor:default; }
    .switch i { position:absolute; inset:0; background:#aab5ad; border-radius:24px; transition:.15s; }
    .switch i::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.35); }
    .switch input:checked + i { background:var(--brand); }
    .switch input:checked + i::after { transform:translateX(16px); }
    .switch input:focus-visible + i { outline:3px solid color-mix(in srgb, var(--brand) 35%, transparent); }

    /* location / team / shop cards */
    .lhead { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .pills { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px; }
    .kv { display:flex; align-items:flex-start; gap:10px; font-size:14px; margin:9px 0; }
    .kv .ico { color:var(--muted); margin-top:2px; }
    .kv.warn span { color:var(--warn); font-weight:700; }
    .kv.warn .ico { color:var(--warn); }
    .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:12px 0 4px; }
    .stat { background:var(--surface-2); border-radius:12px; padding:10px 12px; }
    .stat b { display:block; font-size:20px; line-height:1.1; font-weight:800; }
    .stat small { font-size:12px; }
    .acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .person { display:flex; gap:12px; align-items:center; }
    .person .avatar { width:44px; height:44px; font-size:17px; }
    .hint { font-size:13px; color:var(--muted); margin:4px 0 0; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }

    /* sheet / drawer */
    .overlay { position:fixed; inset:0; background:rgba(8,16,11,.5); z-index:40; display:flex; align-items:flex-end; justify-content:center; animation:fade .15s; }
    .sheet { background:var(--bg); width:100%; max-width:680px; max-height:94vh; overflow:auto; border-radius:22px 22px 0 0; padding:0 16px 16px; animation:rise .2s; }
    @media (min-width:900px) {
      .overlay { align-items:stretch; justify-content:flex-end; }
      .sheet { max-width:640px; max-height:none; height:100%; border-radius:22px 0 0 22px; padding:0 22px 16px; animation:slide .22s; }
    }
    @keyframes fade { from { opacity:0 } } @keyframes rise { from { transform:translateY(40px); opacity:.4 } } @keyframes slide { from { transform:translateX(40px); opacity:.4 } }
    .sheethead { position:sticky; top:0; z-index:3; background:var(--bg); display:flex; justify-content:space-between; align-items:center; padding:16px 0 12px; }
    .sheethead h3 { font-size:19px; font-weight:800; }
    .sheetfoot { position:sticky; bottom:-16px; z-index:3; background:var(--bg); padding:12px 0 16px; display:flex; gap:10px; border-top:1px solid var(--line); margin-top:14px; }
    .sheetfoot .btn.primary { flex:1; }
    .sec { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:4px 16px 16px; margin-bottom:12px; }
    .sec > h4 { margin:14px 0 0; font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
    .lbl { display:block; font-weight:700; font-size:13px; margin:14px 0 6px; }
    .lbl small { font-weight:500; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .photo { display:flex; gap:14px; align-items:center; margin-top:14px; }
    .photo .pthumb { width:88px; height:88px; border-radius:14px; }
    .photo .col { flex:1; min-width:0; }
    .presets { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 2px; align-items:center; }
    .packcard { border:1.5px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; background:var(--surface-2); }
    .packcard .head { display:flex; gap:8px; align-items:center; }
    .packcard .head .field { padding:9px 10px; }
    .packcard .head select.field { width:84px; flex:none; }
    .packcard .head input.q { width:88px; flex:none; }
    .plocs { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .plocs .pbox { flex:1 1 112px; max-width:none; }
    .plocs .pbox.na { opacity:.45; }
    .sellrow { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .sellrow label { display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1.5px solid var(--line); border-radius:11px; padding:8px 12px; font-weight:700; font-size:14px; cursor:pointer; }
    .sellrow input { width:18px; height:18px; accent-color:var(--brand); }
    .def { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; margin-top:10px; }
    .prow { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .prow .pin { width:112px; flex:none; } .prow .area { flex:1; min-width:0; }
    details > summary { cursor:pointer; font-weight:800; padding:14px 0 2px; }

    /* orders */
    .navbtn { position:relative; }
    .navbadge { position:absolute; top:4px; right:10px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--red); color:#fff; font-size:11px; font-weight:800; line-height:18px; text-align:center; }
    @media (min-width:900px) { .navbadge { position:static; margin-left:auto; } }
    .ocard.isnew { border-color:var(--amber); box-shadow:0 0 0 3px color-mix(in srgb, var(--amber) 22%, transparent), var(--shadow); }
    .ocard h3 { display:flex; align-items:center; gap:8px; }
    .ototal { font-size:20px; font-weight:800; color:var(--brand-dark); white-space:nowrap; }
    .ocard a { color:var(--brand-dark); font-weight:700; }
    .oitems { margin:10px 0 2px; border-top:1px dashed var(--line); padding-top:8px; }
    .oitem { display:flex; gap:8px; padding:4px 0; font-size:14px; }
    .oitem .q { width:34px; font-weight:800; color:var(--muted); flex:none; }
    .oitem .n { flex:1; min-width:0; }
    .oitem .p { font-weight:700; }

    /* orders table + filters + reports */
    .filters { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px; margin-bottom:10px; }
    .filters .grow { flex:1 1 240px; min-width:200px; }
    .datectl { display:inline-flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .datepair { display:inline-flex; gap:6px; align-items:center; }
    .field.slim { width:auto; min-width:0; padding:9px 11px; font-size:14px; border-radius:10px; }
    .otable { margin-top:10px; }
    .orow { display:grid; grid-template-columns:1fr auto; grid-template-areas:"no total" "cust status" "items items" "date act"; gap:4px 12px; padding:12px 14px; border-bottom:1px solid var(--line); align-items:center; cursor:pointer; }
    .orow:last-child { border-bottom:0; }
    .orow:hover, .orow:focus-visible { background:color-mix(in srgb, var(--surface-2) 60%, transparent); outline:none; }
    .orow.isnew { box-shadow:inset 3px 0 0 var(--amber); }
    .orow > span { min-width:0; }
    .c-no { grid-area:no; font-weight:800; } .c-total { grid-area:total; font-weight:800; text-align:right; } .c-cust { grid-area:cust; display:flex; flex-direction:column; line-height:1.25; }
    .c-status { grid-area:status; text-align:right; } .c-items { grid-area:items; font-size:13px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .c-date { grid-area:date; font-size:12.5px; color:var(--muted); } .c-act { grid-area:act; text-align:right; } .c-loc { display:none; }
    .c-cust small { color:var(--muted); font-size:12.5px; }
    .ohead { display:none; cursor:default; background:var(--surface-2); font-size:12px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
    .ohead:hover { background:var(--surface-2); }
    @container (min-width:820px) {
      .orow { grid-template-columns:70px 112px 112px minmax(150px,1.1fr) minmax(170px,1.8fr) 92px 104px 96px; grid-template-areas:"no date loc cust items total status act"; gap:12px; padding:11px 16px; }
      .otable.noloc .orow { grid-template-columns:70px 112px minmax(150px,1.1fr) minmax(170px,1.8fr) 92px 104px 96px; grid-template-areas:"no date cust items total status act"; }
      .c-loc { display:block; } .otable.noloc .c-loc { display:none; } .loc-inline { display:none; }
      .c-items { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .c-status { text-align:left; }
      .ohead { display:grid; } .ohead .c-total { text-align:right; }
    }
    .pager { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:12px; font-size:13.5px; }
    .pgbtns { display:inline-flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .pgnum { font-weight:700; padding:0 6px; }
    .kpis { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
    @media (min-width:700px) { .kpis { grid-template-columns:repeat(4,1fr); } }
    .kpi { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); }
    .kpi small { display:block; font-weight:700; } .kpi b { font-size:24px; font-weight:800; letter-spacing:-.01em; }
    .tscroll { overflow-x:auto; }
    .rtable { width:100%; border-collapse:collapse; font-size:14px; }
    .rtable th { text-align:left; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
    .rtable td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
    .rtable tr:last-child td { border-bottom:0; }
    .rtable .r { text-align:right; font-variant-numeric:tabular-nums; }

    /* misc */
    .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); display:flex; align-items:center; gap:10px; background:#14211a; color:#fff; padding:12px 18px; border-radius:12px; z-index:80; max-width:92vw; box-shadow:0 8px 28px rgba(0,0,0,.35); font-weight:600; font-size:14px; animation:rise .18s; }
    .toast.bad { background:#b71c1c; }
    @media (max-width:899px) { .toast { bottom:84px; } }
    .empty { text-align:center; color:var(--muted); padding:48px 16px; }
    .empty .ico { display:flex; justify-content:center; margin-bottom:8px; opacity:.6; }
    .skel { background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 37%,var(--surface-2) 63%); background-size:400% 100%; animation:shim 1.3s infinite; border-radius:12px; }
    @keyframes shim { 0% { background-position:100% 50% } 100% { background-position:0 50% } }

    /* login */
    .loginwrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:radial-gradient(1200px 500px at 50% -10%, var(--brand-soft), transparent), var(--bg); }
    .login { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:30px 24px; box-shadow:0 12px 40px rgba(16,32,22,.12); }
    .login .logo { width:64px; height:64px; border-radius:16px; object-fit:cover; display:block; margin:0 auto 12px; background:var(--brand-soft); }
    .login h2 { text-align:center; font-size:22px; font-weight:800; }
    .login p { text-align:center; margin:4px 0 20px; color:var(--muted); }
    .login .field { margin-bottom:12px; padding:13px 14px; }
    .login .btn { width:100%; min-height:46px; font-size:15px; margin-top:4px; }
    .err { color:var(--red); font-size:14px; margin-top:12px; min-height:20px; text-align:center; }
  </style>
</head>
<body>
  <div id="loginView" class="loginwrap" hidden>
    <div class="login">
      <img class="logo" src="/images/uploads/branding/am-vegetables-logo.png" alt="" onerror="this.style.display='none'" />
      <h2>AM Vegetables</h2>
      <p>Staff login · <span class="ta">பணியாளர் உள்நுழைவு</span></p>
      <input class="field" id="email" type="text" inputmode="tel" placeholder="Mobile number / மொபைல் எண்" autocomplete="username" />
      <input class="field" id="pw" type="password" placeholder="Password / கடவுச்சொல்" autocomplete="current-password" />

  <div id="appView" class="shell" hidden>
    <aside class="side">
      <div class="brand">
        <img src="/images/uploads/branding/am-vegetables-logo.png" alt="" onerror="this.style.display='none'" />

      </div>

        <div class="uinfo"><b id="who">Admin</b><small id="whoSub"></small></div>
        <button class="iconbtn" id="logout" title="Log out" aria-label="Log out"></button>
      </div>
    </aside>
    <main class="content"><div id="main"></div></main>
  </div>

  <div id="sheetRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>

  <script src="/staff/config.js"></script>
  <script src="/staff/app.js"></script>
</body>
